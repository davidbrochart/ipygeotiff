[build-system]
requires = [
    "hatchling>=1.21.1",
    "hatch-jupyter-builder>=0.8.3",
    "jupyterlab>=4.0.0,<5",
    "hatch-nodejs-version>=0.3.2",
]
build-backend = "hatchling.build"

[project]
name = "ipygeotiff"
description = "A Jupyter - geotiff.js bridge"
readme = "README.md"
license = { file = "LICENSE.txt" }
requires-python = ">=3.10"
authors = [
    { name = "David Brochart", email = "david.brochart@gmail.com" },
]
keywords = [
    "IPython",
    "Jupyter",
    "Widgets",
]
classifiers = [
    "Framework :: Jupyter",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "ipywidgets>=8.0.0",
    "numpy",
    "xeus-python",
]
version = "0.1.0.dev0"

[project.optional-dependencies]
docs = [
    "jupyter_sphinx",
    "nbsphinx",
    "nbsphinx-link",
    "pypandoc",
    "pytest_check_links",
    "recommonmark",
    "sphinx>=1.5",
    "sphinx_rtd_theme",
]
examples = []
test = [
    "pytest-cov",
    "pytest>=6.0",
]

[project.urls]
Homepage = "https://github.com/davidbrochart/ipygeotiff"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
artifacts = [
    "ipygeotiff/nbextension/index.*",
    "ipygeotiff/labextension/*.tgz",
    "ipygeotiff/labextension",
]

[tool.hatch.build.targets.wheel.shared-data]
"ipygeotiff/nbextension" = "share/jupyter/nbextensions/ipygeotiff"
"ipygeotiff/labextension" = "share/jupyter/labextensions/ipygeotiff"
"./install.json" = "share/jupyter/labextensions/ipygeotiff/install.json"
"./ipygeotiff.json" = "etc/jupyter/nbconfig/notebook.d/ipygeotiff.json"

[tool.hatch.build.targets.sdist]
exclude = [
    ".github",
]

[tool.hatch.build.hooks.jupyter-builder]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = [
    "ipygeotiff/nbextension/index.js",
    "ipygeotiff/labextension/package.json",
]
skip-if-exists = [
    "ipygeotiff/nbextension/index.js",
    "ipygeotiff/labextension/package.json",
]
dependencies = [
    "hatch-jupyter-builder>=0.8.3",
]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
path = "."
build_cmd = "build:prod"
npm = ["jlpm"]

[[tool.mypy.overrides]]
module = [
    "ipywidgets.*",
    "pytest",
]
ignore_missing_imports = true

[tool.tbump]
field = [
    { name = "channel", default = "" },
    { name = "release", default = "" },
]
file = [
    { src = "pyproject.toml", version_template = "version = \"{major}.{minor}.{patch}{channel}{release}\"" },
    { src = "ipygeotiff/_version.py" },
]

[tool.tbump.version]
current = "0.1.0.dev0"
regex = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)((?P<channel>a|b|rc|.dev)(?P<release>\\d+))?"

[tool.tbump.git]
message_template = "Bump to {new_version}"
tag_template = "v{new_version}"
